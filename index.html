<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Календар планування</title><link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
header img{height:46px}header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;padding:7px 12px;border:1px solid #c5ccd3;background:#e9edf0;border-radius:4px;cursor:pointer}
button:hover{background:#dde3e8}.pri{background:#2c6eaa;color:#fff;border-color:#2c6eaa}
main{display:grid;grid-template-columns:3fr 2fr;gap:12px;padding:12px;max-width:1100px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);padding:12px}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}.nav b{flex:1;text-align:center;font-size:18px;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-style:italic;color:#5b6770;font-size:13px;padding:4px}
.d{aspect-ratio:1.15;border:0;border-radius:0;font-size:16px;padding:0}
.d.sel{outline:3px solid #2c6eaa;outline-offset:-3px}.d.today{font-weight:700}.d.x{pointer-events:none}
.e{background:var(--e)}.low{background:#ffe45c}.normal{background:#ffa94d}.high{background:#ff5a5a}.ok{background:#7fdc5a}
.t{display:flex;gap:8px;align-items:center;padding:8px;margin-top:6px;cursor:pointer;color:#1e2c39}
.t.low{background:#fff3a8}.t.normal{background:#ffcf8a}.t.high{background:#ff9c9c}.t.ok{background:#b5e5b0}
.t span{flex:1}.t small{opacity:.7}
#login{max-width:340px;margin:60px auto;padding:20px;display:grid;gap:10px}
input,select,textarea{font:inherit;padding:7px;width:100%;border:1px solid #c5ccd3;border-radius:4px}
dialog{border:1px solid #888;padding:16px;width:min(420px,94vw)}dialog label{display:block;margin-top:8px;font-weight:600;font-size:14px}
#alarm{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
#alarm .box{background:#fff;padding:16px;max-width:92vw;width:420px;max-height:90vh;overflow:auto}
#alarm .it{border-top:1px solid #ddd;padding:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
[hidden]{display:none!important}.err{color:#b00020;font-size:14px}
:root{--bg:#f4f6f8;--tx:#1e2c39;--hd:#1f3b57;--card:#fff;--bd:#dce2e8;--e:#f7f5f3;--ac:#1f3b57;--btn:#e9edf0}
[data-theme=dark]{--bg:#161b22;--tx:#e6edf3;--hd:#0d1117;--card:#21262d;--bd:#30363d;--e:#3a424b;--ac:#9ecbff;--btn:#30363d}
[data-theme=green]{--bg:#f1f6f1;--hd:#2e6b3e;--ac:#2e6b3e;--e:#f3f6f3;--btn:#e4ede4}
button{background:var(--btn);color:var(--tx)}.pri,.tab.on{background:#2c6eaa;color:#fff;border-color:#2c6eaa}
.d{color:var(--tx)}.d.low,.d.normal,.d.high,.d.ok{color:#1e2c39}
input,select,textarea,dialog,#alarm .box{background:var(--card);color:var(--tx)}
#tabs,#cinfo{max-width:1100px;margin:10px auto 0;padding:0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body>

<!-- НАЛАШТУВАННЯ: вставте свій firebaseConfig у змінну cfg нижче (див. інструкцію в чаті) -->
<div id="login" class="card" hidden>
 <div style="text-align:center"><img class="lg" height="60"><h2>Календар планування</h2></div>
 <input id="em" type="email" placeholder="Email" autocomplete="username">
 <input id="pw" type="password" placeholder="Пароль (від 6 символів)" autocomplete="current-password">
 <button class="pri" id="bin">Увійти</button><button id="breg">Створити акаунт</button>
 <div class="err" id="lerr"></div>
</div>

<div id="app" hidden>
<header><img class="lg"><h1>Календар планування</h1><button id="bset">⚙</button><button id="bout">Вийти</button></header>
<div id="tabs"><button class="tab on" data-m="me">Особистий календар</button><button class="tab" data-m="corp">Корпоративний календар</button></div><div id="cinfo" hidden></div>
<main>
 <div class="card"><div class="nav"><button id="pm">◀</button><b id="ml"></b><button id="td">Сьогодні</button><button id="nm">▶</button></div>
  <div class="grid" id="cal"></div></div>
 <div class="card"><div class="nav"><b id="sl" style="text-align:left"></b><button class="pri" id="add">+ Додати задачу</button></div><div id="list"></div></div>
</main></div>

<dialog id="dlg"><form method="dialog" id="f">
 <label>Назва *</label><input id="fT" required>
 <label>Дата</label><input id="fD" type="date" required>
 <label>Час нагадування (необов’язково)</label><input id="fH" type="time">
 <label>Повтор</label><select id="fR"><option value="">Без повтору<option value="daily">Кожен день<option value="weekly">Кожен тиждень<option value="every10">Кожні 10 днів<option value="monthly">Кожен місяць</select>
 <label>Пріоритет</label><select id="fP"><option value="low">Низький<option value="normal" selected>Звичайний<option value="high">Високий</select>
 <label>Опис</label><textarea id="fN" rows="3"></textarea>
 <div class="row"><button class="pri" id="fS" value="s">Зберегти</button><button type="button" id="fX">Скасувати</button><button type="button" id="fDel" style="margin-left:auto">Видалити</button></div>
</form></dialog>
<dialog id="sdlg"><form method="dialog"><label>Тема</label><select id="sTh"><option value="light">Світла<option value="dark">Темна<option value="green">Зелена</select>
 <label>Мова</label><select id="sLg"><option value="uk">Українська<option value="en">English</select><div class="row"><button class="pri">Закрити</button></div></form></dialog>
<dialog id="mdlg"><form method="dialog"><h3 style="margin-top:0">🏢 Керування календарем</h3><div id="mbody"></div><div class="row"><button class="pri">Закрити</button></div></form></dialog>
<div id="alarm" hidden><div class="box"><h3 style="margin:0">⏰ Час виконати задачу</h3><div id="ai"></div>
<div class="err" style="color:#8a949c;margin-top:8px">Звук триватиме, доки ви не відкладете або не виконаєте задачу (на будь-якому пристрої).</div></div></div>

 if(i==="binv"){const l=location.origin+location.pathname+"?join="+cid;try{await navigator.clipboard.writeText(l);alert(tr("Посилання скопійовано")+":\n"+l)}catch(x){prompt(tr("Скопіюйте посилання"),l)}}};
function renderM(){const me=auth.currentUser.uid,isO=true;
 $("mbody").innerHTML=`<label>Назва календаря</label><div class="row"><input id="mname" value="${esc(cname)}" ${isO?"":"disabled"} style="flex:1">${isO?'<button type="button" id="mren" class="pri">Зберегти назву</button>':""}</div>
 <label>${tr("Учасники")} (${members.length})</label>`+members.map(m=>`<div class="row" style="align-items:center;border-top:1px solid var(--bd);padding:6px 0"><span style="flex:1">${esc(names[m]||tr("(без імені)"))}${m===owner?" 👑":""}${m===me?" ("+tr("ви")+")":""}</span>${m!==me?`<button type="button" data-rm="${m}">Вилучити</button>`:""}</div>`).join("")
 +'<div class="row"><button type="button" id="mleave">Вийти з календаря</button></div>';applyLang()}
$("mbody").onclick=async e=>{const i=e.target.id,rm=e.target.dataset.rm,r=doc(db,"calendars",cid);
 try{if(i==="mren"){const n=$("mname").value.trim();if(n)await updateDoc(r,{name:n})}
  if(rm&&confirm(tr("Вилучити користувача з календаря?")))await updateDoc(r,{members:arrayRemove(rm),["names."+rm]:deleteField()});
  if(i==="mleave"&&confirm(tr("Вийти з календаря?"))){await updateDoc(r,{members:arrayRemove(auth.currentUser.uid)});$("mdlg").close()}}
 catch(x){alert(tr("Помилка")+": "+(x.code||x.message))}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.m;sync()});
$("bset").onclick=()=>{$("sTh").value=pref("theme")||"light";$("sLg").value=LANG;$("sdlg").showModal()};
$("sTh").onchange=e=>{pref("theme",e.target.value);document.documentElement.dataset.theme=e.target.value};
$("sLg").onchange=e=>{pref("lang",e.target.value);location.reload()};
onAuthStateChanged(auth,u=>{unsub&&unsub();unsubC&&unsubC();unsubK&&unsubK();unsub=unsubC=unsubK=null;$("login").hidden=!!u;$("app").hidden=!u;
 if(u){col=collection(db,"users",u.uid,"tasks");
  unsub=onSnapshot(col,s=>{tasksMe=s.docs.map(d=>({id:d.id,cp:"m",...d.data()}));sync()});
  unsubC=onSnapshot(query(collection(db,"calendars"),where("members","array-contains",u.uid)),s=>{const c=s.docs[0];
   if(c){const d=c.data(),nw=cid!==c.id;cid=c.id;cname=d.name;owner=d.owner;members=d.members||[];names=d.names||{};
    if(nw){ccol=collection(db,"calendars",cid,"tasks");unsubK&&unsubK();unsubK=onSnapshot(ccol,k=>{tasksCorp=k.docs.map(x=>({id:x.id,cp:"c",...x.data()}));sync()},()=>{})}
    const me=auth.currentUser;if(me&&me.email&&!names[me.uid])updateDoc(doc(db,"calendars",cid),{["names."+me.uid]:me.email}).catch(()=>{});
    if($("mdlg").open)renderM()}
   else{unsubK&&unsubK();unsubK=null;cid=ccol=null;tasksCorp=[];if($("mdlg").open)$("mdlg").close()}sync()});
  const j=new URLSearchParams(location.search).get("join");
  if(j)updateDoc(doc(db,"calendars",j),{members:arrayUnion(u.uid),["names."+u.uid]:u.email||""}).then(()=>{history.replaceState(null,"",location.pathname);mode="corp";sync()}).catch(()=>alert(tr("Не вдалося приєднатися за посиланням")));
  if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}
 else{tasksMe=[];tasksCorp=[];tasks=[];cid=ccol=null;stopSound()}});

/* ---- календар ---- */
const dayCls=k=>{const a=tasks.filter(t=>t.date===k);if(!a.length)return"e";const o=a.filter(t=>!t.done);if(!o.length)return"ok";
 return["high","normal","low"].find(x=>o.some(t=>t.prio===x))||"normal"};
function render(){const y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),td=iso(new Date());
 $("ml").textContent=MON[m]+" "+y;let h=WD.map(w=>`<div class="wd">${w}</div>`).join("");
 for(let i=0;i<42;i++){const d=i-off+1;if(d<1||d>n){h+='<button class="d e x"></button>';continue}
  const k=`${y}-${p(m+1)}-${p(d)}`;h+=`<button class="d ${dayCls(k)}${k===sel?" sel":""}${k===td?" today":""}" data-d="${k}">${d}</button>`}
 $("cal").innerHTML=h;const s=dt(sel);$("sl").textContent=`${p(s.getDate())}.${p(s.getMonth()+1)}.${s.getFullYear()}`;
 const L=tasks.filter(t=>t.date===sel).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
 $("list").innerHTML=L.map(t=>`<div class="t ${t.done?"ok":t.prio}" data-e="${t.id}"><button data-c="${t.id}">${t.done?"↩":"✓"}</button>
  <span>${t.done?"✓ ":""}${t.rep?"🔁 ":""}${esc(t.title)}<br><small>${t.time||tr("без часу")} · ${tr(PL[t.prio]||"")}${t.sn&&!t.done?" · "+tr("⏰ відкладено"):""}</small></span></div>`).join("")||'<p style="color:#8a949c">Задач немає</p>';applyLang()}
$("cal").onclick=e=>{const k=e.target.dataset.d;if(k){sel=k;render()}};
const shift=n=>{cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()};
$("pm").onclick=()=>shift(-1);$("nm").onclick=()=>shift(1);$("td").onclick=()=>{cur=new Date();sel=iso(cur);render()};

/* ---- задачі ---- */
$("list").onclick=e=>{const c=e.target.dataset.c;if(c){setDone(tasks.find(t=>t.id===c),!tasks.find(t=>t.id===c).done);return}
 const r=e.target.closest("[data-e]");if(r)openDlg(r.dataset.e)};
$("add").onclick=()=>{if(!curCol())return alert(tr("Спершу створіть корпоративний календар"));openDlg(null)};
function openDlg(id){editId=id;const t=tasks.find(x=>x.id===id)||{};$("fT").value=t.title||"";$("fD").value=t.date||sel;$("fH").value=t.time||"";
 $("fR").value=t.rep||"";$("fP").value=t.prio||"normal";$("fN").value=t.desc||"";$("fDel").hidden=!id;$("dlg").showModal()}
$("fX").onclick=()=>$("dlg").close();
$("fDel").onclick=async()=>{if(confirm(tr("Видалити задачу?"))){await deleteDoc(doc(curCol(),editId));$("dlg").close()}};
$("f").onsubmit=async()=>{const old=tasks.find(t=>t.id===editId),id=editId||crypto.randomUUID();
 const when=$("fD").value+" "+($("fH").value||"23:59"); // нова дата/час
 const t={title:$("fT").value.trim(),date:$("fD").value,time:$("fH").value,rep:$("fR").value,prio:$("fP").value,desc:$("fN").value,done:old?(old.done&&when<=fmt(new Date())):false,series:old?.series||id,snooze:""};
 await setDoc(doc(curCol(),id),t);sel=t.date;cur=dt(t.date)};
async function setDone(t,done){await setDoc(doc(colOf(t),t.id),{done,snooze:""},{merge:true});
 if(done&&!t.done&&t.rep){const nd=nextDate(t.od||t.date,t.rep,iso(new Date())),id=t.series+"_"+nd; // однаковий id на всіх пристроях — дубліката не буде
  if(!(t.cp==="c"?tasksCorp:tasksMe).some(x=>x.id===id))await setDoc(doc(colOf(t),id),{title:t.title,date:nd,time:t.ot||t.time||"",rep:t.rep,prio:t.prio,desc:t.desc||"",done:false,series:t.series,snooze:""})}}

/* ---- нагадування: стан спільний для всіх пристроїв ---- */
let seen=new Set(),ringing=false,primed=false;const snd=new Audio(SND_DATA);snd.loop=true;
function unlock(){if(primed)return;primed=true;snd.play().then(()=>{if(!(ringing&&leader)){snd.pause();snd.currentTime=0}}).catch(()=>{primed=false})}
document.addEventListener("click",unlock);
/* сирена грає лише в одній вкладці; якщо її закрити — естафету підхоплює інша */
let leader=false,lockCtl=null,release=null;
function wantSiren(){if(leader||lockCtl)return;if(!navigator.locks){leader=true;return}
 lockCtl=new AbortController();
 navigator.locks.request("planner-siren",{signal:lockCtl.signal},()=>new Promise(r=>{lockCtl=null;
  if(!ringing){r();return}leader=true;release=r;snd.play().catch(()=>{})})).catch(()=>{})}
function stopSound(){ringing=false;if(lockCtl){lockCtl.abort();lockCtl=null}if(release){release();release=null}leader=false;snd.pause();snd.currentTime=0}
function tick(){if(!col)return;const now=fmt(new Date());
 const due=allT().filter(t=>!t.done&&t.time&&(t.snooze||t.date+" "+t.time)<=now);
 $("alarm").hidden=!due.length;
 $("ai").innerHTML=due.map(t=>`<div class="it"><b>${t.cp==="c"?"🏢 ":""}${esc(t.title)}</b><br><small>${t.date} ${t.time}${t.rep?" · 🔁":""}</small>
  <div class="row">Відкласти на: ${[["5 хв",5],["15 хв",15],["1 год",60],["Завтра",1440]].map(([l,m])=>`<button data-s="${t.id}" data-m="${m}">${l}</button>`).join("")}</div>
  <div class="row"><button class="pri" data-ok="${t.id}">Виконано</button></div></div>`).join("");
 applyLang();ringing=due.length>0;if(window.Android){try{Android.setRinging(ringing)}catch(e){}}else if(ringing){wantSiren();if(leader)snd.play().catch(()=>{})}else stopSound();
 due.forEach(t=>{const k=t.id+t.date+t.time;if(!seen.has(k)){seen.add(k);if("Notification"in window&&Notification.permission==="granted"){const n=new Notification("⏰ "+t.title,{body:t.date+" "+t.time,icon:LOGO_DATA,tag:k,silent:true,requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}}})}
$("alarm").onclick=async e=>{const d=e.target.dataset;
 if(d.s){const x=allT().find(t=>t.id===d.s),f=fmt(new Date(Date.now()+d.m*6e4));await setDoc(doc(colOf(x),d.s),{date:f.slice(0,10),time:f.slice(11),snooze:"",sn:1,ot:x.ot||x.time,od:x.od||x.date},{merge:true})}
 if(d.ok){await setDone(allT().find(t=>t.id===d.ok),true)}};
applyLang();setInterval(tick,10000);
</script></body></html>
