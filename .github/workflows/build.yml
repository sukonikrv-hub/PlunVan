name: Build APK
on:
  workflow_dispatch: {}
  push:
    paths: ["android/**", ".github/workflows/build.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: android
        run: gradle assembleDebug -PsiteUrl=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: Kalendar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
